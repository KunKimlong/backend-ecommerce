services:
  postgres:
    image: postgres:latest
    container_name: postgres_ecommerce
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: database
    ports:
      - "5432:5432"

  # Cache for store info (name, logo...); nothing here needs to survive a restart, so persistence is off
  redis:
    image: redis:7-alpine
    container_name: redis_ecommerce
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"

