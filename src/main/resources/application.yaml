server:
  port: ${APPLICATION_PORT}
  host: ${APPLICATION_HOST}
spring:
  application:
    jwt:
      secret-key: ${SECRET_KEY}
      access-token-exp: ${ACCESS_TOKEN_EXP}
      refresh-token-exp: ${REFRESH_TOKEN_EXP}
    cookie-secure: ${COOKIE_SECURE}
    name: ${APPLICATION_NAME}
    admin-generate:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
      first-name: ${ADMIN_FIRST_NAME}
      last-name: ${ADMIN_LAST_NAME}
    store-generate:
      name: ${STORE_NAME}
      description: ${STORE_DESCRIPTION}
      location: ${STORE_LOCATION}
      support-email: ${STORE_SUPPORT_EMAIL}
      support-phone-number: ${STORE_SUPPORT_PHONE_NUMBER}
    cors-urls: ${CORS_URLS}
    # Social sign-in: a provider is switched on by setting its client id (empty = button hidden, endpoint 404)
    social:
      google:
        client-id: ${GOOGLE_CLIENT_ID}
    # Sender of one-time codes; email verification is on only when spring.mail.host is set
    mail:
      from: ${MAIL_FROM}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      # Fail fast instead of holding a sign-up request open on a slow SMTP server
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATASOURCE}
    username: ${DB_USERNAME}
    password: ${DB_PW}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        # Lazy collections across a page (role permissions, user roles...) load in one IN query, not one per row
        default_batch_fetch_size: 50
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:11MB}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      # Short timeouts: if Redis is down, store info falls back to the database instead of hanging
      timeout: 500ms
      connect-timeout: 500ms
      # Redis is only a cache here; all repositories are JPA
      repositories:
        enabled: false
  cache:
    caffeine:
      # Admin edits clear these right away; the time limit covers what edits can't signal (orders, banner dates)
      spec: maximumSize=500,expireAfterWrite=5m
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED}

logging:
  level:
    root: info
  file:
    name: ${LOG_FILE}

app:
  file-storage-path: ${FILE_PATH}
