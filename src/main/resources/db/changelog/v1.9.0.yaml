databaseChangeLog:
  - context: v1.9.0
  - changeSet:
      id: 1793300000000-1
      author: Claude
      comment: >-
        Links an external sign-in (Google today, other providers later) to a user. The provider's own
        account id (subject) is the stable key; email can change on the provider side, so it is not used here.
      changes:
        - createTable:
            tableName: user_identities
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_identities_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: provider
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
        - addUniqueConstraint:
            tableName: user_identities
            columnNames: provider, subject
            constraintName: uk_user_identities_provider_subject
        - createIndex:
            tableName: user_identities
            indexName: idx_user_identities_user
            columns:
              - column:
                  name: user_id
