databaseChangeLog:
  - context: v1.13.0
  - changeSet:
      id: 1793700000000-1
      author: Claude
      comment: >-
        Phone numbers are now validated in international form (@ValidPhone). Numbers saved before the
        country picker are Cambodian local numbers (0 + 8-9 digits), which the admin app already reads
        as KH; store them as +855 so they pass validation when a profile or the store is saved again.
      changes:
        - sql:
            sql: >-
              UPDATE users SET phone = '+855' || substring(phone from 2)
              WHERE phone ~ '^0[0-9]{8,9}$';
              UPDATE stores SET support_phone_number = '+855' || substring(support_phone_number from 2)
              WHERE support_phone_number ~ '^0[0-9]{8,9}$';
